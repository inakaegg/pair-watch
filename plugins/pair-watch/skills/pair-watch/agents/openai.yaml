interface:
  display_name: "Pair-watch"
  short_description: "Supervised pair launched from one chat: the invoking chat watches, launches implementer seats (Claude via tmux; Codex via sequenced files, including Codex + Codex)"
  default_prompt: "Start Pair-watch from this chat. If this is Codex and the user explicitly names a Codex peer, act as the Codex watcher and use the sequenced file transport. Otherwise say that a Codex chat cannot launch or message Claude sessions and ask the user to start pair-watch from a Claude chat."
