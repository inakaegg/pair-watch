# 用語辞書（textlint-rule-prh用）
# 一般読者向けの日本語文書（README.ja.md）で、開発用語を英語のまま置かないための規則。
# 日本語の文字（ひらがな・漢字）に隣接する英単語だけを対象にし、コード識別子や
# 「会話記録（transcript）」のような初出の併記は対象外にする。
# 元はagent-kitの辞書（縮退・起床）。同型の指摘が2件以上出た語をここへ足す。
version: 1
rules:
  - expected: フォールバック
    pattern: 縮退
    prh: fallbackの直訳。読者に伝わらない
  - expected: 起動
    pattern: 起床
    prh: wakeの直訳。プロセスやエージェントには「起動」「再開」を使う
  - expected: コミット
    pattern: /(?<=[ぁ-ん一-龥、。])commit(?=[ぁ-ん一-龥、。])/
    prh: 日本語の文中ではカタカナで「コミット」と書く（コード識別子や `git commit` は対象外）
  - expected: 関門
    pattern: /(?<=[ぁ-ん一-龥、。])gate(?=[ぁ-ん一-龥、。])/
    prh: 日本語の文中では「関門」または「レビューの関門」と書く
  - expected: 会話記録
    pattern: /(?<=[ぁ-ん一-龥、。])transcript(?=[ぁ-ん一-龥、。])/
    prh: 日本語の文中では「会話記録」と書く。初出は「会話記録（transcript）」の併記でよい
  - expected: サブエージェント
    pattern: /(?<=[ぁ-ん一-龥、。])subagent(?=[ぁ-ん一-龥、。])/
    prh: 日本語の文中ではカタカナで書く
  - expected: チームメイト
    pattern: /(?<=[ぁ-ん一-龥、。])teammate(?=[ぁ-ん一-龥、。])/
    prh: 日本語の文中ではカタカナで書く
